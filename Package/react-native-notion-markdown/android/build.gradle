group = "react.native.markdown.markdown"
version = "0.0.1"

apply plugin: "com.android.library"
apply plugin: "expo-module-gradle-plugin"

android {
  namespace "expo.modules.markdown"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // ReactFontManager resolves the theme's font families the way React Native Text does.
  implementation 'com.facebook.react:react-android'
}
