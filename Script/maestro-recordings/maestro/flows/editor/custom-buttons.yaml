appId: com.gagesorrell.notionmarkdown.storybook
---
- runFlow:
    file: ../_shared/open-story.yaml
    env:
      STORY_ID: "editor--custom-buttons"
      ASSERT_TEXT: "Editor"
- assertVisible: "Highlight"
- tapOn: "Highlight"
- tapOn: "AI Tools"
- assertVisible: "Custom panel content goes here."
- tapOn: "Close"
- assertNotVisible: "Custom panel content goes here."
