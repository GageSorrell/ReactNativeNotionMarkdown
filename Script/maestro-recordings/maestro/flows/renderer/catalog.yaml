appId: com.gagesorrell.markdown.storybook
---
- runFlow:
    file: ../_shared/open-story.yaml
    env:
      STORY_ID: "renderer--catalog"
      ASSERT_TEXT: "Renderer catalog"
- assertVisible: "Input: markdown"
- tapOn: "Switch renderer input"
- assertVisible: "Input: document"
- assertVisible: "Dark"
- tapOn: "Toggle dark mode"
- assertVisible: "Light"
- scrollUntilVisible:
    element:
      text: "References and previews"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Table and columns"
    direction: UP
