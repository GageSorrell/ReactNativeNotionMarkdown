# Shared sub-flow: force-stops the app (if running) and opens it fresh via the
# `notionmarkdownstorybook://open?STORYBOOK_STORY_ID=<id>` deep link, which
# `@storybook/react-native`'s `getStorybookUI` reads from the *initial* URL and uses to
# override whatever story `AsyncStorage` last persisted (see the plan's "Deterministic
# story navigation" section). Force-stopping first guarantees the link is the app's
# initial intent rather than a live "url" event, so this always takes the same code
# path regardless of Android's launch-mode/onNewIntent behavior.
#
# Params:
#   STORY_ID    - Storybook story id, e.g. "editor--default"
#   ASSERT_TEXT - text/accessibility-label visible only once that story has rendered;
#                 used to fail fast on a broken link instead of recording a stale screen
appId: com.gagesorrell.notionmarkdown.storybook
---
- stopApp
- openLink: "notionmarkdownstorybook://open?STORYBOOK_STORY_ID=${STORY_ID}"
- extendedWaitUntil:
    visible: "${ASSERT_TEXT}"
    timeout: 15000
