appId: com.gagesorrell.notionmarkdown.storybook
---
# `resolved` defaults to true with no artificial delay, so the resolved text renders
# immediately; toggling it off/on to show the unresolved state needs the Controls
# addon (deferred).
- runFlow:
    file: ../_shared/open-story.yaml
    env:
      STORY_ID: "renderer-blocks--synced-block-reference"
      ASSERT_TEXT: "Resolved synced text block"
