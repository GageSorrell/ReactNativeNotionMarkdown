appId: com.gagesorrell.notionmarkdown.storybook
---
# Shows the default bullet + nested bullet; toggling `nestedText` needs the Controls
# addon (deferred).
- runFlow:
    file: ../_shared/open-story.yaml
    env:
      STORY_ID: "renderer-blocks--bulleted-list-item"
      ASSERT_TEXT: "Bulleted item"
- assertVisible: "Nested bullet"
