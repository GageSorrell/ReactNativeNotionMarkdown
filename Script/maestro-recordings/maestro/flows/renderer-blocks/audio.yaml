appId: com.gagesorrell.markdown.storybook
---
- runFlow:
    file: ../_shared/open-story.yaml
    env:
      STORY_ID: "renderer-blocks--audio"
      ASSERT_TEXT: "Local preview audio"
- tapOn: "Play audio"
- extendedWaitUntil:
    visible: "Pause audio"
    timeout: 5000
- tapOn: "Pause audio"
- assertVisible: "Play audio"
